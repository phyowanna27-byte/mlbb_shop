  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 480px; }
    .header h1 { font-size: 20px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    .header p { font-size: 13px; color: #94a3b8; }

    .currency-switcher { display: flex; background: #1e293b; border-radius: 12px; padding: 4px; margin-bottom: 14px; width: 100%; max-width: 480px; border: 1px solid #334155; }
    .curr-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .curr-btn.active { background: #38bdf8; color: #0f172a; }

    .notice { width: 100%; max-width: 480px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 8px; padding: 10px; font-size: 12px; color: #bae6fd; line-height: 1.5; margin-bottom: 14px; }
    .warning { color: #f87171; font-weight: 600; margin-top: 4px; }

    .section-title { width: 100%; max-width: 480px; font-size: 14px; font-weight: 700; color: #f59e0b; margin: 14px 0 8px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 480px; margin-bottom: 10px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
    .card .title { font-size: 13px; font-weight: 600; color: #f1f5f9; line-height: 1.3; }
    .card .badge { display: inline-block; font-size: 10px; font-weight: 700; color: #ef4444; background: rgba(239, 68, 68, 0.15); padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; align-self: center; }
    .card .price { font-size: 14px; font-weight: 700; color: #38bdf8; }
    .card button { background: #0284c7; color: white; border: none; padding: 8px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .card button:active { background: #0369a1; }

    /* Modal Popup Form */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: flex-start; padding: 16px; overflow-y: auto; }
    .modal-box { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; width: 100%; max-width: 440px; padding: 18px; margin: auto 0; }
    .modal-box h3 { color: #38bdf8; font-size: 17px; margin-bottom: 4px; text-align: center; }
    .modal-box .sub { font-size: 14px; color: #fbbf24; font-weight: 700; text-align: center; margin-bottom: 14px; }
