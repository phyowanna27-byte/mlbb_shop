<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>May Lay Game Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #0b1329; color: #f8fafc; padding: 15px; padding-bottom: 60px; }
    
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; color: #38bdf8; }
    .header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    /* Currency Switch */
    .currency-switch { display: flex; gap: 10px; margin-bottom: 16px; }
    .currency-btn {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .currency-btn.active {
      background: #0284c7; color: #ffffff; border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
    }

    .notice {
      background: #172554; border: 1px solid #1e3a8a; border-radius: 8px;
      padding: 10px; font-size: 12px; line-height: 1.6; color: #93c5fd; margin-bottom: 16px;
    }

    .section-title { font-size: 15px; color: #f59e0b; margin-bottom: 10px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 12px 8px; text-align: center;
    }
    .badge {
      display: inline-block; font-size: 10px; background: rgba(239, 68, 68, 0.2);
      color: #f87171; padding: 2px 6px; border-radius: 6px; margin-bottom: 5px;
    }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .card-price { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .buy-btn {
      width: 100%; background: #0284c7; color: white; border: none;
      padding: 8px 0; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); z-index: 1000; justify-content: center; align-items: flex-end;
    }
    .modal-content {
      background: #1e293b; width: 100%; max-height: 90vh; overflow-y: auto;
      border-radius: 16px 16px 0 0; padding: 20px; border-top: 1px solid #475569;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 10px; background: #0b1329; border: 1px solid #334155;
      border-radius: 6px; color: white; font-size: 14px;
    }

    .payment-box {
      background: #0b1329; border: 1px solid #334155; border-radius: 6px;
      padding: 12px; margin-bottom: 15px; font-size: 12px; line-height: 1.6;
    }

    .submit-btn {
      width: 100%; background: #22c55e; color: white; border: none;
      padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>💎 May Lay Game Shop</h1>
    <p>စိန်နှင့် ပက်ကေ့ချ်များ အမြန်ဖြည့်သွင်းရန်</p>
  </div>

  <!-- Currency Switcher -->
  <div class="currency-switch">
    <button id="btn-mmk" class="currency-btn active" onclick="switchCurrency('MMK')">🇲🇲 မြန်မာကျပ် (Ks)</button>
    <button id="btn-thb" class="currency-btn" onclick="switchCurrency('THB')">🇹🇭 ထိုင်းဘတ် (฿)</button>
  </div>

  <div class="notice">
    📌 <b>လိုအပ်ချက်:</b> User ID + Zone ID (Server ID)<br>
    ⚡ <b>ကြာမြင့်ချိန်:</b> အချိန်စောင့်စရာမလိုဘဲ တန်းရောက်ပါသည်။
  </div>

  <!-- Pass Section -->
  <div class="section-title">🔥 PASS & BUNDLE ပက်ကေ့ချ်များ</div>
  <div class="grid" id="pass-grid"></div>

  <!-- Diamonds Section -->
  <div class="section-title">⚡ စိန်သီးသန့် (DIAMONDS)</div>
  <div class="grid" id="diamond-grid"></div>

  <!-- Order Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>အော်ဒါတင်ရန်</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div class="form-group">
        <label>ဝယ်ယူမည့် ပစ္စည်းနှင့် စျေးနှုန်း</label>
        <input type="text" id="selectedItemDisplay" readonly style="color: #38bdf8; font-weight: bold;">
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 2;">
          <label>User ID</label>
          <input type="number" id="userId" placeholder="12345678">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Server ID</label>
          <input type="number" id="zoneId" placeholder="1234">
        </div>
      </div>

      <div class="payment-box" id="paymentDetails"></div>

      <div class="form-group">
        <label>ငွေလွှဲပြေစာ (စလစ်) ပုံရွေးပါ</label>
        <input type="file" id="slipFile" accept="image/*">
      </div>

      <button class="submit-btn" id="btnSubmit" onclick="submitOrder()">ငွေလွှဲပြေစာ ပို့မည်</button>
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8834166717:AAFfuD_ge9Xkfa48sp0iBaRXRpHALWaI5uk";
    const ADMIN_CHAT_ID = "8863215122";

    let currentCurrency = 'MMK';
    let selectedPackage = null;

    const passList = [
      { name: "Weekly Diamond Pass", badge: "အထူးတန်", mmk: 7000, thb: 75 },
      { name: "Twilight Pass", badge: "Skin ရယူရန်", mmk: 37500, thb: 395 },
      { name: "Weekly Elite Bundle", badge: "Bundle", mmk: 3800, thb: 40 },
      { name: "Monthly Epic Bundle", badge: "Bundle", mmk: 18800, thb: 200 }
    ];

    const diamondList = [
      { name: "86 Diamonds", badge: "Direct", mmk: 5800, thb: 60 },
      { name: "172 Diamonds", badge: "Direct", mmk: 11500, thb: 120 },
      { name: "257 Diamonds", badge: "Direct", mmk: 17000, thb: 180 },
      { name: "343 Diamonds", badge: "Direct", mmk: 23000, thb: 240 },
      { name: "706 Diamonds", badge: "Direct", mmk: 46000, thb: 480 },
      { name: "2195 Diamonds", badge: "Direct", mmk: 140000, thb: 1450 }
    ];

    function switchCurrency(curr) {
      currentCurrency = curr;
      document.getElementById('btn-mmk').className = (curr === 'MMK') ? 'currency-btn active' : 'currency-btn';
      document.getElementById('btn-thb').className = (curr === 'THB') ? 'currency-btn active' : 'currency-btn';
      renderPackages();
    }

    function renderPackages() {
      // Render Passes
      const passBox = document.getElementById('pass-grid');
      let passHtml = '';
      for (let i = 0; i < passList.length; i++) {
        const item = passList[i];
        const price = (currentCurrency === 'MMK') ? item.mmk.toLocaleString() + ' Ks' : item.thb.toLocaleString() + ' ฿';
        passHtml += `
          <div class="card">
            <span class="badge">${item.badge}</span>
            <div class="card-title">${item.name}</div>
            <div class="card-price">${price}</div>
            <button class="buy-btn" onclick="openOrder('pass', ${i})">ဝယ်ယူမည်</button>
          </div>
        `;
      }
      passBox.innerHTML = passHtml;

      // Render Diamonds
      const diaBox = document.getElementById('diamond-grid');
      let diaHtml = '';
      for (let i = 0; i < diamondList.length; i++) {
        const item = diamondList[i];
        const price = (currentCurrency === 'MMK') ? item.mmk.toLocaleString() + ' Ks' : item.thb.toLocaleString() + ' ฿';
        diaHtml += `
          <div class="card">
            <span class="badge">${item.badge}</span>
            <div class="card-title">${item.name}</div>
            <div class="card-price">${price}</div>
            <button class="buy-btn" onclick="openOrder('dia', ${i})">ဝယ်ယူမည်</button>
          </div>
        `;
      }
      diaBox.innerHTML = diaHtml;
    }

    function openOrder(type, index) {
      selectedPackage = (type === 'pass') ? passList[index] : diamondList[index];
      const priceText = (currentCurrency === 'MMK') ? selectedPackage.mmk.toLocaleString() + ' Ks' : selectedPackage.thb.toLocaleString() + ' ฿';
      document.getElementById('selectedItemDisplay').value = selectedPackage.name + ' (' + priceText + ')';

      const payBox = document.getElementById('paymentDetails');
      if (currentCurrency === 'MMK') {
        payBox.innerHTML = `
          <b>🇲🇲 မြန်မာကျပ်ဖြင့် ငွေလွှဲရန် အကောင့်:</b><br>
          • KPay / Wave: <b>09xxxxxxxxx</b> (ဦးဝန)<br>
          ကျသင့်ငွေ: <b>${priceText}</b>
        `;
      } else {
        payBox.innerHTML = `
          <b>🇹🇭 ထိုင်းဘတ်ဖြင့် ငွေလွှဲရန် အကောင့်:</b><br>
          • PromptPay / K-Bank: <b>08xxxxxxxx</b> (Phyo Wanna)<br>
          ကျသင့်ငွေ: <b>${priceText}</b>
        `;
      }

      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    async function submitOrder() {
      const uid = document.getElementById('userId').value.trim();
      const zone = document.getElementById('zoneId').value.trim();
      const fileInput = document.getElementById('slipFile');

      if (!uid || !zone) {
        alert("User ID နှင့် Server ID ကို အပြည့်အစုံ ဖြည့်ပေးပါခင်ဗျာ။");
        return;
      }
      if (!fileInput.files || fileInput.files.length === 0) {
        alert("ငွေလွှဲပြေစာ (စလစ်) ပုံ ရွေးပေးပါခင်ဗျာ။");
        return;
      }

      const submitBtn = document.getElementById('btnSubmit');
