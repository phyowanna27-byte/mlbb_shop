<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>May Lay Game Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 15px; padding-bottom: 50px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; color: #38bdf8; }
    .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }

    /* Currency Switch */
    .currency-switch { display: flex; gap: 10px; margin-bottom: 20px; }
    .currency-btn {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .currency-btn.active {
      background: #0284c7; color: #ffffff; border-color: #38bdf8;
    }

    .notice {
      background: #172554; border: 1px solid #1e3a8a; border-radius: 10px;
      padding: 12px; font-size: 12px; line-height: 1.6; color: #93c5fd; margin-bottom: 20px;
    }

    .section-title { font-size: 15px; color: #f59e0b; margin-bottom: 12px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 12px; text-align: center;
    }
    .badge {
      display: inline-block; font-size: 10px; background: rgba(239, 68, 68, 0.2);
      color: #f87171; padding: 2px 6px; border-radius: 8px; margin-bottom: 4px;
    }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .card-price { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .buy-btn {
      width: 100%; background: #0284c7; color: white; border: none;
      padding: 8px 0; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); z-index: 1000; justify-content: center; align-items: flex-end;
    }
    .modal-content {
      background: #1e293b; width: 100%; max-height: 90vh; overflow-y: auto;
      border-radius: 16px 16px 0 0; padding: 20px; border-top: 1px solid #475569;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155;
      border-radius: 6px; color: white; font-size: 14px;
    }

    .payment-box {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 12px; margin-bottom: 15px; font-size: 12px; line-height: 1.6;
    }

    .submit-btn {
      width: 100%; background: #22c55e; color: white; border: none;
      padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>💎 May Lay Game Shop</h1>
    <p>စိန်နှင့် ပက်ကေ့ချ်များ အမြန်ဖြည့်သွင်းရန်</p>
  </div>

  <div class="currency-switch">
    <button id="btn-mmk" class="currency-btn active" onclick="switchCurrency('MMK')">🇲🇲 မြန်မာကျပ် (Ks)</button>
    <button id="btn-thb" class="currency-btn" onclick="switchCurrency('THB')">🇹🇭 ထိုင်းဘတ် (฿)</button>
  </div>

  <div class="notice">
    📌 <b>လိုအပ်ချက်:</b> User ID + Zone ID (Server ID)<br>
