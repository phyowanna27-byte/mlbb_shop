<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>May Lay Game Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1329; color: #f8fafc; padding: 15px; padding-bottom: 60px; }
    
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; color: #38bdf8; }
    .header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    /* Currency Switch Tabs */
    .tab-container { display: flex; gap: 10px; margin-bottom: 16px; position: relative; z-index: 10; }
    .tab-btn {
      flex: 1; padding: 12px 10px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-size: 14px; font-weight: bold;
      text-align: center; cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .tab-btn.active {
      background: #0284c7; color: #ffffff; border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
    }

    .notice {
      background: #172554; border: 1px solid #1e3a8a; border-radius: 8px;
      padding: 10px 12px; font-size: 12px; line-height: 1.6; color: #93c5fd; margin-bottom: 16px;
    }

    .section-title { font-size: 15px; color: #f59e0b; margin: 15px 0 10px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 12px 8px; text-align: center; display: flex; flex-direction: column; justify-content: space-between;
    }
    .badge {
      display: inline-block; align-self: center; font-size: 10px; background: rgba(239, 68, 68, 0.2);
      color: #f87171; padding: 2px 6px; border-radius: 6px; margin-bottom: 5px;
    }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .card-price { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .buy-btn {
      width: 100%; background: #0284c7; color: white; border: none;
      padding: 10px 0; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer;
    }

    .loading-box { text-align: center; color: #94a3b8; padding: 25px 10px; font-size: 14px; }

    /* Order Form Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); z-index: 1000; justify-content: center; align-items: flex-end;
    }
    .modal-content {
      background: #1e293b; width: 100%; max-height: 90vh; overflow-y: auto;
      border-radius: 16px 16px 0 0; padding: 20px; border-top: 1px solid #475569;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 10px; background: #0b1329; border: 1px solid #334155;
      border-radius: 6px; color: white; font-size: 14px;
    }

    /* Nickname Check Status */
    .nick-box {
      font-size: 12px; margin-top: 4px; padding: 6px 10px; border-radius: 6px; display: none;
    }
    .nick-box.success { display: block; background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #86efac; }
    .nick-box.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
    .nick-box.loading { display: block; background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #7dd3fc; }

    .payment-box {
      background: #0b1329; border: 1px solid #334155; border-radius: 6px;
      padding: 12px; margin-bottom: 15px; font-size: 12px; line-height: 1.6;
    }

    .submit-btn {
      width: 100%; background: #22c55e; color: white; border: none;
      padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>💎 May Lay Game Store</h1>
    <p>MLBB စိန်နှင့် ပက်ကေ့ချ်များ အမြန်ဖြည့်သွင်းရန်</p>
  </div>

  <div class="tab-container">
    <div id="btn-thb" class="tab-btn active" onclick="switchCurrency('THB')">🇹🇭 ထိုင်းဘတ် (฿)</div>
    <div id="btn-mmk" class="tab-btn" onclick="switchCurrency('MMK')">🇲🇲 မြန်မာကျပ် (Ks)</div>
  </div>

  <div class="notice">
    📌 <b>လိုအပ်ချက်:</b> User ID + Zone ID (Server ID)<br>
    ⚡ <b>ကြာမြင့်ချိန်:</b> အချိန်စောင့်စရာမလိုဘဲ တန်းရောက်ပါသည်။
  </div>

  <div id="catalog-container">
    <div class="loading-box">စျေးနှုန်းစာရင်းများကို ရယူနေပါသည်...</div>
  </div>

  <!-- Order Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🛒 အော်ဒါတင်ရန်</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div class="form-group">
        <label>ဝယ်ယူမည့် ပစ္စည်းနှင့် စျေးနှုန်း</label>
        <input type="text" id="selectedItemDisplay" readonly style="color: #38bdf8; font-weight: bold;">
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 2;">
          <label>User ID</label>
          <input type="number" id="userId" placeholder="12345678" oninput="checkNickname()">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Server ID</label>
          <input type="number" id="zoneId" placeholder="1234" oninput="checkNickname()">
        </div>
      </div>

      <!-- In-game Nickname Status Box -->
      <div id="nicknameBox" class="nick-box"></div>

      <div class="payment-box" id="paymentDetails" style="margin-top: 12px;"></div>

      <div class="form-group">
        <label>ငွေလွှဲပြေစာ (စလစ်) ပုံရွေးပါ</label>
        <input type="file" id="slipFile" accept="image/*">
      </div>

      <button class="submit-btn" id="btnSubmit" onclick="submitOrder()">ငွေလွှဲပြေစာ ပို့မည်</button>
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8834166717:AAFfuD_ge9Xkfa48sp0iBaRXRpHALWaI5uk";
    const ADMIN_CHAT_ID = "8863215122";
    const SPREADSHEET_ID = "19Ryx-h258rS8duejpKA2Y0WoD2drx77CkFzc-6MYBbg";

    let currentCurrency = 'THB';
    let allItems = [];
    let selectedItem = null;
    let verifiedNickname = "";
    let checkTimeout = null;

    // Google Sheets မှ ဒေတာ Live ရယူခြင်း
    async function fetchPrices() {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv`;
      try {
        const res = await fetch(url);
        const text = await res.text();
        const rows = text.split("\n").map(r => r.split(",").map(c => c.replace(/^["'](.*)["']$/, '$1').trim()));
        
        allItems = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (row.length >= 4 && row[1]) {
            allItems.push({
              category: row[0] || 'Diamonds',
              name: row[1],
              mmk: Number(row[2]) || 0,
              thb: Number(row[3]) || 0,
              badge: row[4] || ''
            });
          }
        }
        renderCatalog();
      } catch (err) {
        document.getElementById('catalog-container').innerHTML = 
          '<div class="loading-box" style="color: #ef4444;">Google Sheet ဒေတာရယူ၍ မရနိုင်ပါ။</div>';
      }
    }

    function switchCurrency(curr) {
      currentCurrency = curr;
      document.getElementById('btn-thb').className = (curr === 'THB') ? 'tab-btn active' : 'tab-btn';
      document.getElementById('btn-mmk').className = (curr === 'MMK') ? 'tab-btn active' : 'tab-btn';
      renderCatalog();
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-container');
      const categories = {};

      allItems.forEach((item, index) => {
        const priceVal = (currentCurrency === 'MMK') ? item.mmk : item.thb;
        if (priceVal <= 0) return;

        if (!categories[item.category]) {
          categories[item.category] = [];
        }
        categories[item.category].push({ ...item, originalIndex: index });
      });

      let fullHtml = '';
      for (const catName in categories) {
        fullHtml += `<div class="section-title">⚡ ${catName}</div><div class="grid">`;
        categories[catName].forEach(item => {
          const priceText = (currentCurrency === 'MMK') 
            ? `${item.mmk.toLocaleString()} Ks` 
            : `${item.thb.toLocaleString()} ฿`;

          const badgeHtml = item.badge ? `<span class="badge">${item.badge}</span>` : '';
          fullHtml += `
            <div class="card">
              ${badgeHtml}
              <div class="card-title">${item.name}</div>
              <div class="card-price">${priceText}</div>
              <button class="buy-btn" onclick="openOrder(${item.originalIndex})">ဝယ်ယူမည်</button>
            </div>
          `;
        });
        fullHtml += `</div>`;
      }

      container.innerHTML = fullHtml || '<div class="loading-box">ရောင်းချရန် ပစ္စည်းမရှိသေးပါ။</div>';
    }

    function openOrder(index) {
      selectedItem = allItems[index];
      const priceText = (currentCurrency === 'MMK') 
        ? `${selectedItem.mmk.toLocaleString()} Ks` 
        : `${selectedItem.thb.toLocaleString()} ฿`;

      document.getElementById('selectedItemDisplay').value = `${selectedItem.name} (${priceText})`;

      const payBox = document.getElementById('paymentDetails');
      if (currentCurrency === 'MMK') {
        payBox.innerHTML = `
          <b>🇲🇲 မြန်မာကျပ်ဖြင့် ငွေလွှဲရန် အကောင့်:</b><br>
          • KPay / Wave: <b>ဆက်သွယ်မေးမြန်းပါ</b><br>
          ကျသင့်ငွေ: <b style="color: #4ade80;">${priceText}</b>
        `;
      } else {
        payBox.innerHTML = `
          <b>🇹🇭 ထိုင်းဘတ်ငွေလွှဲရန် အကောင့်:</b><br>
          🏦 <b>Bangkok Bank (ဘန်ကောက်ဘဏ်)</b><br>
          • Account No: <b style="color: #38bdf8; font-size: 15px;">0408228211</b><br>
          • Name: <b>Mr. Phyo Wanna Linn</b><br>
          • ကျသင့်ငွေ: <b style="color: #4ade80;">${priceText}</b><br><br>
          <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 6px; padding: 6px 8px; font-size: 11px; color: #fca5a5; line-height: 1.5;">
            ⚠️ <b>သတိပြုရန်:</b> ငွေမလွှဲမီ နာမည်တူမှ ဆက်လွှဲပါ။<br>
            ❌ Note ထဲတွင် စိန်ဝယ်ခြင်း၊ MLBB သို့မဟုတ် ဂိမ်းနာမည်များ လုံးဝမရေးရပါ။
          </div>
        `;
      }

      // Reset ID and Nickname box
      document.getElementById('userId').value = '';
      document.getElementById('zoneId').value = '';
      const nickBox = document.getElementById('nicknameBox');
      nickBox.style.display = 'none';
      verifiedNickname = "";

      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    // MLBB In-game Nickname စစ်ဆေးသည့် Function
    function checkNickname() {
      const uid = document.getElementById('userId').value.trim();
      const zone = document.getElementById('zoneId').value.trim();
      const nickBox = document.getElementById('nicknameBox');

      clearTimeout(checkTimeout);

      if (uid.length >= 6 && zone.length >= 4) {
        nickBox.className = 'nick-box loading';
        nickBox.innerText = '🔍 ဂိမ်းနာမည် စစ်ဆေးနေပါသည်...';

        checkTimeout = setTimeout(async () => {
          try {
            const res = await fetch(`https://api.isan.eu.org/nickname/ml?id=${uid}&zone=${zone}`);
            const data = await res.json();

            if (data.success && data.name) {
              verifiedNickname = decodeURIComponent(data.name);
              nickBox.className = 'nick-box success';
              nickBox.innerHTML = `✅ <b>ဂိမ်းနာမည်:</b> ${verifiedNickname}`;
            } else {
              verifiedNickname = "";
              nickBox.className = 'nick-box error';
              nickBox.innerText = '⚠️ ID သို့မဟုတ် Server ID မှားယွင်းနေပါသည်။';
            }
          } catch (e) {
            verifiedNickname = "";
            nickBox.className = 'nick-box error';
            nickBox.innerText = '⚠️ ဂိမ်းနာမည် ရှာမတွေ့ပါ။ ID သေချာစစ်ဆေးပေးပါ။';
          }
        }, 500);
      } else {
        nickBox.style.display = 'none';
        verifiedNickname = "";
      }
    }

    async function submitOrder() {
      const uid = document.getElementById('userId').value.trim();
      const zone = document.getElementById('zoneId').value.trim();
      const fileInput = document.getElementById('slipFile');

      if (!uid || !zone) {
        alert("User ID နှင့် Server ID ကို အပြည့်အစုံ ဖြည့်ပေးပါခင်ဗျာ။");
        return;
      }
      if (!fileInput.files || fileInput.files.length === 0) {
        alert("ငွေလွှဲပြေစာ (စလစ်) ပုံ ရွေးပေးပါခင်ဗျာ။");
        return;
      }

      const submitBtn = document.getElementById('btnSubmit');
      submitBtn.disabled = true;
      submitBtn.innerText = "ပို့ဆောင်နေပါသည်...";

      let customerId = "WebUser";
      let customerName = "Customer";

      if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
        customerId = window.Telegram.WebApp.initDataUnsafe.user.id;
        customerName = window.Telegram.WebApp.initDataUnsafe.user.first_name || "Customer";
      }

      const priceText = (currentCurrency === 'MMK') 
        ? `${selectedItem.mmk.toLocaleString()} Ks` 
        : `${selectedItem.thb.toLocaleString()} ฿`;

      const nickText = verifiedNickname ? `🎮 Nickname : ${verifiedNickname}\n` : '';

      const caption = `🛒 အော်ဒါအသစ် ရောက်ရှိပါပြီ!\n\n` +
        `👤 ဝယ်သူ : ${customerName} (ID: ${customerId})\n` +
        `📦 ပက်ကေ့ချ် : ${selectedItem.name}\n` +
        `💰 ကျသင့်ငွေ : ${priceText}\n` +
        nickText +
        `🆔 User ID : ${uid} (${zone})`;

      const callbackData = `ok:${customerId}`;

      const replyMarkup = {
        inline_keyboard: [
          [{ text: "✅ စိန်ထည့်ပြီးပါပြီ", callback_data: callbackData }]
        ]
      };

      const formData = new FormData();
      formData.append("chat_id", ADMIN_CHAT_ID);
      formData.append("photo", fileInput.files[0]);
      formData.append("caption", caption);
      formData.append("reply_markup", JSON.stringify(replyMarkup));

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: "POST",
          body: formData
        });
        const res = await response.json();
        if (res.ok) {
          alert("အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်ခင်ဗျာ!");
          closeModal();
          if (window.Telegram?.WebApp) window.Telegram.WebApp.close();
        } else {
          alert("Error: " + res.description);
        }
      } catch (err) {
        alert("လိုင်းအမှားဖြစ်ပေါ်ပါသည်: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "ငွေလွှဲပြေစာ ပို့မည်";
      }
    }

    // စတင်ချိန်တွင် Google Sheet ဒေတာများကို ရယူပြသခြင်း
    fetchPrices();
  </script>
</body>
</html>
