    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 15px; padding-bottom: 50px; }

    /* Currency Switcher */
    .currency-switch { display: flex; gap: 10px; margin-bottom: 20px; }
    .currency-btn {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .currency-btn.active {
      background: #0284c7; color: #ffffff; border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* Notice Box */
    .notice {
      background: #172554; border: 1px solid #1e3a8a; border-radius: 10px;
      padding: 12px; font-size: 12px; line-height: 1.6; color: #93c5fd; margin-bottom: 20px;
    }

    /* Section Titles */
    .section-title { font-size: 16px; color: #f59e0b; margin-bottom: 12px; font-weight: bold; }

    /* Package Grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
    .card {

      padding: 12px; text-align: center; position: relative;
    }
    .badge {

    }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .card-price { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 10px; }
    .buy-btn {
      width: 100%; background: #0284c7; color: white; border: none;
      padding: 8px 0; border-radius: 8px; font-weight: 600; cursor: pointer;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;

    }

    .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
